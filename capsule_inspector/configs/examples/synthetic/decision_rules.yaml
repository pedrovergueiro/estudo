# Overlay de EXEMPLO (dataset sintético). Limiares NÃO calibrados.
rules_version: "0.1.0-synthetic"

capsule_class: capsule
capsule_min_confidence: 0.40
expected_capsules: {min: 1, max: 1}

default_thresholds: {fail: 0.50, review: 0.20}
class_thresholds:
  crack:            {fail: 0.45, review: 0.10}
  hole:             {fail: 0.45, review: 0.10}
  foreign_particle: {fail: 0.45, review: 0.10}
  stain:            {fail: 0.50, review: 0.15}
  scratch:          {fail: 0.55, review: 0.20}

severity_actions: {critical: FAIL, major: FAIL, minor: REVIEW}
max_defects_per_capsule_before_review: 6
unassociated_defect_action: REVIEW
anomaly_action: REVIEW
quality_failure_action: REVIEW

pass_requires:
  validated_profile: true
  approved_model: true
  validated_critical_classes: true
  required_acquisition_present: true

quality:
  min_mean_intensity: 20
  max_mean_intensity: 235
  max_saturated_fraction: 0.08
  min_sharpness_laplacian_var: 15.0
  border_margin_px: 3
  min_capsule_area_fraction: 0.005
