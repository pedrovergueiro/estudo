# Configuração do módulo de dados.
dataset_version: "0.1.0"

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  splits: data/splits
  reports: data/reports

# Dataset de trabalho no formato YOLO (images/ + labels/ com mesmo nome-base).
# `metadata_csv` é opcional mas fortemente recomendado: sem ele a divisão por
# unidade física / lote / sessão não pode ser garantida.
working_dataset:
  name: capsules_v0
  root: data/processed/capsules_v0
  task: detect            # detect | segment
  metadata_csv: data/processed/capsules_v0/metadata.csv

# Colunas esperadas no metadata.csv (todas texto; vazias são aceitas):
#   image            caminho relativo ao root (ex.: images/img_0001.png)
#   unit_id          identificador da cápsula física (todas as vistas/iluminações)
#   lot              lote de produção
#   session          sessão de aquisição
#   finish           opaque | translucent | transparent
#   color            ex.: white, red_white, clear, blue
#   lighting         ex.: diffuse, backlight, side_left
#   profile          nome do perfil de configs/lighting_profiles.yaml
metadata_columns: [image, unit_id, lot, session, finish, color, lighting, profile]

split:
  seed: 20251013
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  # Ordem de preferência para a chave de agrupamento. A primeira coluna presente e
  # preenchida é usada. Todas as imagens do mesmo grupo vão para o mesmo split.
  group_by: [unit_id, lot, session]
  # Imagens quase idênticas (correlação normalizada de miniaturas 32x32 >= valor)
  # são fundidas no mesmo grupo mesmo que o metadata diga o contrário — proteção
  # contra vazamento. Calibre com seus dados: veja a distribuição no relatório.
  near_duplicate_ncc: 0.995
  # Opcional: forçar lotes inteiros para o teste (validação entre lotes).
  holdout_lots: []

validation:
  min_box_size_px: 2
  max_aspect_ratio_image: 4.0
  min_instances_per_enabled_class: 30   # abaixo disso: aviso "dados insuficientes"
  imbalance_warning_ratio: 20.0          # max/min instâncias entre classes habilitadas
  near_duplicate_ncc: 0.995

# Fontes externas. NENHUMA é baixada automaticamente. `download_datasets.py`
# só baixa uma fonte com `direct_url` + `sha256` preenchidos e quando o usuário
# confirma explicitamente a licença com --accept-license. Campos de licença
# devem ser verificados pelo usuário na página oficial antes do uso.
sources:
  chukyo_medicinal_capsule:
    title: "Medicinal Capsule Image Dataset (Chukyo University)"
    info_url: "Pesquisar no site do grupo de pesquisa da Chukyo University (acesso por solicitação)"
    access: request
    license: "Verificar com os autores — tipicamente uso acadêmico"
    commercial_use: unknown
    expected_format: unknown
    direct_url: null
    sha256: null
  pillqc:
    title: "PillQC"
    info_url: "Consultar a publicação/repositório oficial do PillQC"
    access: unknown
    license: "Verificar"
    commercial_use: unknown
    expected_format: unknown
    direct_url: null
    sha256: null
  pill_defects:
    title: "Pill-Defects"
    info_url: "Consultar a página oficial do dataset (ex.: Roboflow Universe/Kaggle)"
    access: unknown
    license: "Verificar (licenças variam por versão)"
    commercial_use: unknown
    expected_format: yolo_or_coco
    direct_url: null
    sha256: null
  capsuledet:
    title: "CapsuleDet"
    info_url: "Consultar a publicação original; usar apenas se o acesso for concedido"
    access: request
    license: "Verificar"
    commercial_use: unknown
    expected_format: unknown
    direct_url: null
    sha256: null
  sensum_sodf:
    title: "SensumSODF"
    info_url: "https://www.sensum.eu/ (verificar termos de uso)"
    access: request
    license: "Verificar — uso pode ser restrito a pesquisa"
    commercial_use: unknown
    expected_format: classification_with_masks
    direct_url: null
    sha256: null
  mvtec_ad_capsule:
    title: "MVTec AD — categoria 'capsule' (útil para o Modo C, anomalias)"
    info_url: "https://www.mvtec.com/company/research/datasets/mvtec-ad"
    access: form
    license: "CC BY-NC-SA 4.0 (não comercial) — confirmar na página oficial"
    commercial_use: "no"
    expected_format: anomaly_masks
    direct_url: null
    sha256: null
